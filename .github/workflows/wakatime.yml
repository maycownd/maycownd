---
name: WakaTime Charts

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WakaTime README stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: false
          TIME_RANGE: this_week
          LANG_COUNT: 7

      - name: Generate fallback SVG chart
        run: |
          mkdir -p images
          STATS_URL="https://github-readme-stats.vercel.app/api/wakatime?username=maycownd"
          wget -q -O images/wakatime.svg "$STATS_URL"
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '📊 Update WakaTime stats'
          file_pattern: '*.md images/*'
