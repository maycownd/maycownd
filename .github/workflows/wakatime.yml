# .github/workflows/wakatime.yml
name: Wakatime Charts (Fixed)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Use Athul's action (99% success rate, no branch issues)
      - name: Update WakaTime readme stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: false
          TIME_RANGE: this_week
          LANG_COUNT: 5

      # Alternative: Generate SVG charts manually
      - name: Generate SVG charts
        run: |
          mkdir -p images
          wget -O images/wakatime.svg "https://github-readme-stats.vercel.app/api/wakatime?username=maycownd"
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Update WakaTime stats"
          file_pattern: '*.md images/*'
