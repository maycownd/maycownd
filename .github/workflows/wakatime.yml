# .github/workflows/wakatime.yml
name: Wakatime Charts (Tokyo Night)

on:
  schedule:
    - cron: "0 0 * * *"  # daily at midnight UTC
  workflow_dispatch:

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 👈 Add this for write access

    steps:
      - uses: actions/checkout@v4

      - name: Generate WakaTime charts (TokyoNight)
        uses: Fr4nk1inCs/wakatime-charts@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: main  # 👈 Changed from "master"
          IMAGES_FOLDER: images
          COMMIT_MESSAGE: "📊 Update WakaTime charts"
